name: DailyQuotes
options:
  bundleIdPrefix: com.mac
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

targets:
  DailyQuotes:
    type: application
    platform: iOS
    sources:
      - path: DailyQuotes
        excludes:
          - "Info.plist"
    info:
      path: DailyQuotes/Info.plist
      properties:
        CFBundleDisplayName: Цитаты дня
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_NAME: DailyQuotes
        PRODUCT_BUNDLE_IDENTIFIER: com.mac.dailyquotes
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO

  DailyQuotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DailyQuotesTests
    dependencies:
      - target: DailyQuotes
    settings:
      base:
        PRODUCT_NAME: DailyQuotesTests
        PRODUCT_BUNDLE_IDENTIFIER: com.mac.dailyquotes.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DailyQuotes.app/DailyQuotes"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DailyQuotes:
    build:
      targets:
        DailyQuotes: all
        DailyQuotesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DailyQuotesTests
